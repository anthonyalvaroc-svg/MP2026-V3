<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reportes de Campo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #1e293b; padding-bottom: 40px; }
    header { background: #1e293b; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 16px; margin-bottom: 10px; }
    button { border: none; border-radius: 6px; padding: 12px 14px; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    button:active { opacity: 0.85; }
    .btn-primary { background: #1e293b; color: #fff; width: 100%; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-zip { background: #334155; color: #fff; flex: 1; }
    .btn-share { background: #0f766e; color: #fff; flex: 1; }
    .btn-cam { background: #1e293b; color: #fff; flex: 1; }
    .btn-up { background: #475569; color: #fff; flex: 1; }
    .btn-danger { background: #fee2e2; color: #991b1b; padding: 8px 12px; font-size: 13px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab { flex: 1; background: #e2e8f0; color: #334155; padding: 10px 6px; font-size: 13px; text-align: center; border-radius: 6px; }
    .tab.active { background: #1e293b; color: #fff; }
    .folder-item { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .folder-title { font-weight: 700; font-size: 15px; color: #0f172a; margin-bottom: 4px; }
    .folder-desc { font-size: 13px; color: #475569; margin-bottom: 10px; line-height: 1.35; }
    .status-badge { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 4px; background: #f1f5f9; color: #475569; margin-bottom: 8px; border: 1px solid #cbd5e1; }
    .status-badge.has-files { background: #dcfce7; color: #166534; border-color: #86efac; }
    .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .thumb { position: relative; border: 1px solid #cbd5e1; border-radius: 6px; overflow: hidden; background: #f8fafc; }
    .thumb img, .thumb video { width: 100%; height: 85px; object-fit: cover; display: block; }
    .thumb-pdf { height: 85px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #991b1b; padding: 4px; text-align: center; }
    .thumb-name { font-size: 10px; padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #fff; }
    .thumb-del { position: absolute; top: 3px; right: 3px; background: rgba(15,23,42,0.8); color: #fff; border-radius: 4px; width: 22px; height: 22px; font-size: 12px; padding: 0; }
    
    /* Modal Camara */
    #cameraModal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
    #cameraVideo { width: 100%; flex: 1; object-fit: cover; }
    .cam-overlay-info { position: absolute; bottom: 95px; left: 12px; right: 12px; color: #fff; text-shadow: 1px 1px 3px #000; font-size: 13px; line-height: 1.35; pointer-events: none; background: rgba(0,0,0,0.35); padding: 8px; border-radius: 6px; }
    .cam-controls { background: #1e293b; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .btn-shutter { background: #fff; color: #0f172a; font-size: 16px; font-weight: 700; flex: 2; padding: 14px; border-radius: 8px; }
    .btn-close-cam { background: #475569; color: #fff; flex: 1; padding: 14px; border-radius: 8px; }
    .cam-counter { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,0.65); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 14px; font-weight: 600; }
    
    #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.75); z-index: 2000; color: #fff; align-items: center; justify-content: center; flex-direction: column; padding: 20px; text-align: center; }
    .share-box { background: #fff; color: #1e293b; padding: 20px; border-radius: 8px; max-width: 340px; width: 100%; }
  </style>
</head>
<body>

<header>
  <h1>Reportes de Campo</h1>
  <button id="btnBack" class="btn-secondary" style="display:none; padding: 8px 12px; font-size: 14px;" onclick="showHome()">← Carpetas</button>
</header>

<div class="container">
  <!-- VISTA PRINCIPAL: LISTA DE CARPETAS -->
  <div id="homeView">
    <div class="card">
      <label for="newSiteName">Nombre de Carpeta Principal (Site)</label>
      <input type="text" id="newSiteName" placeholder="Ej: SITE_LIMA_NORTE_01">
      <button class="btn-primary" onclick="createProject()">+ Crear Carpeta</button>
    </div>
    <div id="projectsList"></div>
  </div>

  <!-- VISTA INTERNA: SUBCARPETAS DE UN PROYECTO -->
  <div id="projectView" style="display:none;">
    <div class="card">
      <label>Carpeta Principal</label>
      <div class="row" style="margin-top:0;">
        <input type="text" id="editSiteName" style="margin-bottom:0;">
        <button class="btn-secondary" onclick="renameCurrentProject()">Guardar</button>
      </div>
      <div class="row">
        <button class="btn-zip" onclick="generateZip('download')">Descargar ZIP</button>
        <button class="btn-share" onclick="generateZip('share')">Compartir ZIP</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab1" onclick="switchTab(1)">1. F17-CARPETA DE FOTOS</button>
      <button class="tab" id="tab2" onclick="switchTab(2)">2. FORMATOS MP</button>
      <button class="tab" id="tab3" onclick="switchTab(3)">3. MANTENIMIENTO PREVENTIVO</button>
    </div>

    <div id="subfoldersContainer"></div>
  </div>
</div>

<!-- MODAL CAMARA NATIVA CON SELLO DE AGUA -->
<div id="cameraModal">
  <div class="cam-counter" id="camCounter">Fotos: 0</div>
  <video id="cameraVideo" autoplay playsinline></video>
  <div class="cam-overlay-info" id="camLiveOverlay">Obteniendo fecha, hora y ubicación...</div>
  <div class="cam-controls">
    <button class="btn-close-cam" onclick="closeCamera()">Listo</button>
    <button class="btn-shutter" onclick="capturePhoto()">TOMAR FOTO</button>
  </div>
</div>

<!-- OVERLAY DE PROCESO / COMPARTIR -->
<div id="loadingOverlay">
  <div id="loadingText" style="font-size: 16px; font-weight: 600;">Procesando...</div>
  <div id="shareReadyBox" class="share-box" style="display:none;">
    <div style="font-weight: 700; font-size: 16px; margin-bottom: 8px;">Archivo ZIP Listo</div>
    <div id="shareFileName" style="font-size: 13px; color: #475569; margin-bottom: 14px; word-break: break-all;"></div>
    <button class="btn-share" style="width: 100%; margin-bottom: 8px;" onclick="triggerNativeShare()">Enviar ahora</button>
    <button class="btn-secondary" style="width: 100%;" onclick="closeOverlay()">Cerrar</button>
  </div>
</div>

<input type="file" id="hiddenFileInput" multiple style="display:none;" onchange="handleFileUpload(event)">

<script src="app.js"></script>
</body>
</html>
